<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IFE 2026 AI Literacy Track — Block Cards (Wireframe)</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cambio-primary: #c8b8e0;
    --cambio-secondary: #d8b8c8;
    --cambio-tertiary: #a8c8d8;
    --cambio-bg: #f8f7f5;
    --cambio-card: #ffffff;
    --cambio-border: #d8d5dc;
    --cambio-text: #2a2830;
    --cambio-muted: #8a8892;
    --cambio-line: #c8c5cc;
    --fill-recall: #e8e0f0;
    --fill-instructor: #f0e0e8;
    --fill-pod: #d8ece8;
    --fill-share: #ece0c8;
    --fill-exit: #e8e6ea;
    --bar-recall: #b8a8d0;
    --bar-instructor: #c8a8b8;
    --bar-pod: #98c0b8;
    --bar-share: #c8b888;
    --bar-exit: #b8b5bc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--cambio-bg);
    color: var(--cambio-text);
    font-family: 'Space Grotesk', sans-serif;
    padding: 40px 24px 80px;
  }
  .wrap { max-width: 840px; margin: 0 auto; }

  .header {
    text-align: center;
    margin-bottom: 48px;
    padding: 32px 0 24px;
    position: relative;
  }
  .header::after {
    content: '';
    display: block;
    width: 60px;
    height: 2px;
    background: var(--cambio-primary);
    margin: 20px auto 0;
  }
  .cambio { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: var(--cambio-muted); margin-bottom: 8px; }
  .header h1 { font-size: 22px; font-weight: 600; line-height: 1.3; }
  .header h1 span { color: var(--cambio-muted); font-weight: 400; }
  .sub { font-size: 13px; color: var(--cambio-muted); margin-top: 6px; }

  .legend {
    display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
    margin-bottom: 36px; font-size: 11px; color: var(--cambio-muted);
  }
  .lg { display: flex; align-items: center; gap: 6px; }
  .sw { width: 12px; height: 12px; border: 1.5px solid; display: inline-block; }

  .wk {
    font-size: 13px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--cambio-muted); margin: 40px 0 16px; padding-bottom: 8px;
    border-bottom: 1px solid var(--cambio-line);
  }
  .wk b { color: var(--cambio-text); }

  .card {
    background: var(--cambio-card); border: 1px solid var(--cambio-border);
    padding: 20px 24px 16px; margin-bottom: 16px;
    page-break-inside: avoid; break-inside: avoid;
  }
  .card-h {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px;
  }
  .card-n { font-size: 13px; font-weight: 700; color: var(--cambio-tertiary); min-width: 20px; }
  .card-t { font-size: 15px; font-weight: 600; }
  .card-m { font-size: 11px; color: var(--cambio-muted); margin-left: auto; white-space: nowrap; }

  .gantt {
    position: relative; height: 26px; display: flex;
    border-left: 1px solid var(--cambio-line); border-right: 1px solid var(--cambio-line);
  }
  .gantt-s {
    height: 100%; display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 500; position: relative; overflow: hidden;
  }
  .gantt-s:not(:last-child) { border-right: 1px solid var(--cambio-card); }
  .gantt-s span { position: relative; z-index: 1; opacity: 0.75; line-height: 1; }

  .tl {
    display: flex; position: relative; height: 20px;
    border-left: 1px solid var(--cambio-line); border-right: 1px solid var(--cambio-line);
    margin-bottom: 8px;
  }
  .tl-t {
    position: absolute; top: 0; width: 1px; height: 8px; background: var(--cambio-line);
  }
  .tl-t span {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    font-size: 9px; color: var(--cambio-muted); white-space: nowrap;
  }

  .key { display: flex; gap: 14px; flex-wrap: wrap; font-size: 10px; color: var(--cambio-muted); }
  .k-i { display: flex; align-items: center; gap: 5px; }
  .k-d { width: 7px; height: 7px; border: 1.5px solid; border-radius: 50%; }

  @media print {
    body { padding: 0.5in; background: #fff; }
    .card { border-color: #ccc; }
    .gantt-s span { opacity: 1; }
  }
</style>
</head>
<body>
<div class="wrap">

<div class="header">
  <div class="cambio">Cambio Labs V1.0</div>
  <h1>IFE 2026 AI Literacy Track <span>— Block Cards</span></h1>
  <p class="sub">Wireframe overview of all 14 AI companion modules: run of show, activity segments, and artifact</p>
</div>

<div id="legend" class="legend"></div>
<div id="content"></div>

<script>
const COL = {
  recall:  { fill: '#e8e0f0', bar: '#b8a8d0' },
  instructor: { fill: '#f0e0e8', bar: '#c8a8b8' },
  pod:    { fill: '#d8ece8', bar: '#98c0b8' },
  share:  { fill: '#ece0c8', bar: '#c8b888' },
  exit:   { fill: '#e8e6ea', bar: '#b8b5bc' }
};

const MODULES = [
  {n:'The Inheritance', w:'WEEK 1 · <b>ai is a mirror, not a mind</b>', m:'W1 D2 · 90 min', d:90,
   segs:[{t:'Recall',s:'recall',w:4},{t:'Instructor',s:'instructor',w:10},{t:'Pod: Train-the-prompt',s:'pod',w:20},{t:'Pod: Cheat-sheet v0',s:'pod',w:16},{t:'Share: Pairs',s:'share',w:12},{t:'Pod: Iterate',s:'pod',w:12},{t:'Exit',s:'exit',w:4}]},
  {n:'Same Question, Different Mouths', w:'WEEK 1 · <b>ai is a mirror, not a mind</b>', m:'W1 D3 · 80 min', d:80,
   segs:[{t:'Recall',s:'recall',w:2},{t:'Instructor',s:'instructor',w:5},{t:'Instructor: Demo',s:'instructor',w:14},{t:'Pod: Compare outputs',s:'pod',w:25},{t:'Share: Gallery',s:'share',w:14},{t:'Pod: Reframe',s:'pod',w:14},{t:'Exit',s:'exit',w:3}]},
  {n:'The Sanity Report', w:'WEEK 1 · <b>ai is a mirror, not a mind</b>', m:'W1 D4 · 60 min', d:60,
   segs:[{t:'Recall',s:'recall',w:2},{t:'Instructor',s:'instructor',w:10},{t:'Instructor: Re-rank',s:'instructor',w:12},{t:'Pod: Sanity-check',s:'pod',w:30},{t:'Share: Rank',s:'share',w:12},{t:'Exit',s:'exit',w:6}]},
  {n:'The Statistical Shadow', w:'WEEK 2 · <b>ai is a sampler, not a source</b>', m:'W2 D1 · 90 min', d:90,
   segs:[{t:'Recall',s:'recall',w:2},{t:'Pod: Draw',s:'pod',w:8},{t:'Pod: Sample',s:'pod',w:12},{t:'Pod: Distributions',s:'pod',w:24},{t:'Pod: Predict-next',s:'pod',w:16},{t:'Share: Gallery',s:'share',w:12}]},
  {n:'The Yes-Man', w:'WEEK 2 · <b>ai is a sampler, not a source</b>', m:'W2 D2 · 90 min', d:90,
   segs:[{t:'Recall',s:'recall',w:2},{t:'Instructor',s:'instructor',w:8},{t:'Pod: Jailbreak',s:'pod',w:8},{t:'Pod: Test',s:'pod',w:12},{t:'Pod: Document',s:'pod',w:16},{t:'Instructor: Debrief',s:'instructor',w:12},{t:'Pod: Safety brief',s:'pod',w:12},{t:'Exit',s:'exit',w:4}]},
  {n:'The Generation Game', w:'WEEK 2 · <b>ai is a sampler, not a source</b>', m:'W2 D3 · 90 min', d:90,
   segs:[{t:'Recall',s:'recall',w:2},{t:'Instructor',s:'instructor',w:12},{t:'Instructor: Fail',s:'instructor',w:8},{t:'Pod: Generate',s:'pod',w:26},{t:'Pod: Audit',s:'pod',w:16},{t:'Share: Compare',s:'share',w:8}]},
  {n:'The Stage Set', w:'WEEK 2 · <b>ai is a sampler, not a source</b>', m:'W2 D5 · 90 min', d:90,
   segs:[{t:'Recall',s:'recall',w:2},{t:'Instructor',s:'instructor',w:12},{t:'Instructor: Brief',s:'instructor',w:12},{t:'Pod: Plan',s:'pod',w:30},{t:'Pod: Prep',s:'pod',w:16},{t:'Exit',s:'exit',w:2}]},
  {n:'Not the Writer, Not the Designer', w:'WEEK 3 · <b>ai is a tool, not an agent</b>', m:'W3 D1 · 90 min', d:90,
   segs:[{t:'Recall',s:'recall',w:2},{t:'Instructor',s:'instructor',w:16},{t:'Share: Impressions',s:'share',w:8},{t:'Pod: Claude Code',s:'pod',w:32},{t:'Pod: Debrief',s:'pod',w:12},{t:'Exit',s:'exit',w:2}]},
  {n:'The Imaginary Friend', w:'WEEK 3 · <b>ai is a tool, not an agent</b>', m:'W3 D2 · 90 min', d:90,
   segs:[{t:'Recall',s:'recall',w:2},{t:'Share: Persona',s:'share',w:12},{t:'Instructor',s:'instructor',w:20},{t:'Pod: Map',s:'pod',w:20},{t:'Pod: Stance',s:'pod',w:16},{t:'Exit',s:'exit',w:2}]},
  {n:'The Footnote', w:'WEEK 3 · <b>ai is a tool, not an agent</b>', m:'W3 D3 · 90 min', d:90,
   segs:[{t:'Recall',s:'recall',w:2},{t:'Instructor',s:'instructor',w:12},{t:'Instructor: Search',s:'instructor',w:12},{t:'Instructor: Matrix',s:'instructor',w:8},{t:'Pod: Verify',s:'pod',w:28},{t:'Share: Report',s:'share',w:10}]},
  {n:'The Stack', w:'WEEK 3 · <b>ai is a tool, not an agent</b>', m:'W3 D5 · 90 min', d:90,
   segs:[{t:'Recall',s:'recall',w:2},{t:'Instructor',s:'instructor',w:20},{t:'Pod: Map',s:'pod',w:32},{t:'Pod: Budget',s:'pod',w:16},{t:'Exit',s:'exit',w:2}]},
  {n:'The Invisible Market', w:'WEEK 4 · <b>ai is a position, not a destination</b>', m:'W4 D1 · 90 min', d:90,
   segs:[{t:'Recall',s:'recall',w:2},{t:'Instructor',s:'instructor',w:12},{t:'Pod: Brief',s:'pod',w:24},{t:'Pod: Map',s:'pod',w:20},{t:'Pod: Pitch',s:'pod',w:14}]},
  {n:'The Automated Self', w:'WEEK 4 · <b>ai is a position, not a destination</b>', m:'W4 D2 · 90 min', d:90,
   segs:[{t:'Recall',s:'recall',w:2},{t:'Instructor',s:'instructor',w:12},{t:'Pod: Curate',s:'pod',w:16},{t:'Pod: Build',s:'pod',w:32},{t:'Share: Showcase',s:'share',w:10}]},
  {n:'The Mark', w:'WEEK 4 · <b>ai is a position, not a destination</b>', m:'W4 D3 · 90 min', d:90,
   segs:[{t:'Recall',s:'recall',w:2},{t:'Instructor',s:'instructor',w:4},{t:'Pod: Brand',s:'pod',w:30},{t:'Pod: Pitch',s:'pod',w:32},{t:'Share: Critique',s:'share',w:4}]}
];

// Build legend
const lg = document.getElementById('legend');
for (const [k, v] of Object.entries(COL)) {
  const el = document.createElement('span'); el.className = 'lg';
  el.innerHTML = '<span class="sw" style="border-color:'+v.bar+';background:'+v.fill+'"></span>'+
    k.charAt(0).toUpperCase()+k.slice(1);
  lg.appendChild(el);
}

// Build cards
const ct = document.getElementById('content');
let lastW = '';
for (const m of MODULES) {
  if (m.w !== lastW) {
    lastW = m.w;
    const wk = document.createElement('div'); wk.className = 'wk';
    wk.innerHTML = m.w;
    ct.appendChild(wk);
  }

  const card = document.createElement('div'); card.className = 'card';

  // Header
  const h = document.createElement('div'); h.className = 'card-h';
  h.innerHTML = '<span class="card-n">'+(MODULES.indexOf(m)+1)+'</span>'+
    '<span class="card-t">'+m.n+'</span>'+
    '<span class="card-m">'+m.m+'</span>';
  card.appendChild(h);

  // Gantt
  const g = document.createElement('div'); g.className = 'gantt';
  for (const seg of m.segs) {
    const s = document.createElement('div'); s.className = 'gantt-s';
    s.style.width = (seg.w/m.d*100)+'%';
    s.style.background = COL[seg.s].fill;
    s.style.borderBottom = '2px solid '+COL[seg.s].bar;
    s.innerHTML = '<span>'+seg.t+'</span>';
    g.appendChild(s);
  }
  card.appendChild(g);

  // Timeline
  const tl = document.createElement('div'); tl.className = 'tl';
  const step = m.d <= 60 ? 15 : 15;
  for (let t = 0; t <= m.d; t += step) {
    const tk = document.createElement('div'); tk.className = 'tl-t';
    tk.style.left = (t/m.d*100)+'%';
    tk.innerHTML = '<span>'+t+'′</span>';
    tl.appendChild(tk);
  }
  card.appendChild(tl);

  // Activity key
  const key = document.createElement('div'); key.className = 'key';
  for (const seg of m.segs) {
    const ki = document.createElement('span'); ki.className = 'k-i';
    ki.innerHTML = '<span class="k-d" style="border-color:'+COL[seg.s].bar+';background:'+COL[seg.s].fill+'"></span>'+
      seg.t+' · '+seg.w+'′';
    key.appendChild(ki);
  }
  card.appendChild(key);

  ct.appendChild(card);
}
</script>

</div>
</body>
</html>
