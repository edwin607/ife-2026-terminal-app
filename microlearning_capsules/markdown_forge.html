<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Forge | AI Writing Playground</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Space+Grotesk:wght@300;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background-color: #020617; color: #f8fafc; }
        .mono { font-family: 'Fira Code', monospace; }
        .preview-area h1 { font-size: 2.25rem; font-weight: 700; border-bottom: 2px solid #1e293b; padding-bottom: 0.5rem; margin-top: 1.5rem; margin-bottom: 1rem; }
        .preview-area h2 { font-size: 1.5rem; font-weight: 700; margin-top: 1.25rem; margin-bottom: 0.75rem; }
        .preview-area p { margin-bottom: 1rem; color: #cbd5e1; line-height: 1.6; }
        .preview-area ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
        .preview-area code { background: #1e293b; padding: 0.2rem 0.4rem; rounded: 0.25rem; font-family: 'Fira Code', monospace; font-size: 0.875rem; }
        .preview-area table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
        .preview-area th, .preview-area td { border: 1px solid #334155; padding: 0.75rem; text-align: left; }
        .preview-area th { background: #0f172a; }
        .settings-panel { transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .settings-open .settings-panel { transform: translateX(0); }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
    
    <!-- Neural Link Settings -->
    <div id="settings-root" class="fixed inset-y-0 right-0 w-80 bg-slate-900 border-l border-slate-800 z-50 settings-panel p-8 shadow-2xl">
        <h3 class="text-sm font-bold uppercase tracking-widest text-emerald-500 mb-6">Neural Link Settings</h3>
        <div class="space-y-4">
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase">OpenRouter API Key</label>
                <input id="api-key" type="password" class="w-full bg-black border border-slate-700 rounded-lg px-3 py-2 mt-1 text-xs focus:ring-1 focus:ring-emerald-500 outline-none" placeholder="sk-or-v1-...">
            </div>
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase">Model</label>
                <select id="model-select" class="w-full bg-black border border-slate-700 rounded-lg px-3 py-2 mt-1 text-xs outline-none">
                    <option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet</option>
                    <option value="openai/gpt-4o-mini">GPT-4o Mini</option>
                    <option value="meta-llama/llama-3.1-8b-instruct:free">Llama 3.1 8B (Free)</option>
                </select>
            </div>
            <button onclick="toggleSettings()" class="w-full mt-4 bg-slate-800 py-2 rounded-lg text-xs font-bold hover:bg-slate-700 transition">Save & Close</button>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <span class="bg-emerald-600 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">Capsule 08: Documentation</span>
            <h1 class="text-xl font-bold tracking-tight">Markdown <span class="text-emerald-500">Forge</span></h1>
        </div>
        <div class="flex gap-3">
            <button onclick="downloadMd()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-bold transition flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                Export .md
            </button>
            <button onclick="toggleSettings()" class="px-4 py-2 bg-emerald-600/10 border border-emerald-500/20 text-emerald-400 rounded-xl text-xs font-bold hover:bg-emerald-600/20 transition">
                AI Assistant
            </button>
        </div>
    </header>

    <!-- Toolbar -->
    <div class="bg-slate-950 border-b border-slate-900 px-6 py-2 flex gap-4 overflow-x-auto no-scrollbar">
        <button onclick="insertText('# ')" class="text-[10px] font-bold text-slate-500 hover:text-white uppercase">H1</button>
        <button onclick="insertText('## ')" class="text-[10px] font-bold text-slate-500 hover:text-white uppercase">H2</button>
        <button onclick="insertText('**', '**')" class="text-[10px] font-bold text-slate-500 hover:text-white uppercase">Bold</button>
        <button onclick="insertText('* ', '')" class="text-[10px] font-bold text-slate-500 hover:text-white uppercase">List</button>
        <button onclick="insertText('| Header | Header |\n| --- | --- |\n| Cell | Cell |')" class="text-[10px] font-bold text-slate-500 hover:text-white uppercase">Table</button>
        <div class="w-px h-4 bg-slate-800 mx-2"></div>
        <button onclick="aiAction('summarize')" class="text-[10px] font-bold text-emerald-500 hover:text-emerald-400 uppercase">AI Summarize</button>
        <button onclick="aiAction('professional')" class="text-[10px] font-bold text-emerald-500 hover:text-emerald-400 uppercase">AI Professional Tone</button>
    </div>

    <!-- Main Editor -->
    <main class="flex-1 flex overflow-hidden">
        <!-- Editor Side -->
        <div class="flex-1 border-r border-slate-800 flex flex-col">
            <textarea id="editor" class="flex-1 bg-black p-8 mono text-sm outline-none resize-none leading-relaxed text-slate-400 focus:text-slate-200 transition-colors" placeholder="# Start your business documentation here..."></textarea>
        </div>

        <!-- Preview Side -->
        <div class="flex-1 bg-slate-950 overflow-y-auto p-12 preview-area" id="preview">
            <!-- Rendered content goes here -->
        </div>
    </main>

    <!-- Footer Status -->
    <footer class="bg-slate-900 border-t border-slate-800 px-4 py-2 flex justify-between text-[10px] font-mono text-slate-500">
        <div id="word-count">Words: 0 | Tokens: 0</div>
        <div id="ai-status">AI Status: Ready</div>
    </footer>

    <script>
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');

        // Markdown Rendering
        editor.addEventListener('input', () => {
            const rawValue = editor.value;
            preview.innerHTML = marked.parse(rawValue);
            updateStats();
        });

        function updateStats() {
            const text = editor.value;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            const tokens = Math.ceil(text.length / 4);
            document.getElementById('word-count').innerText = `Words: ${words} | Tokens: ${tokens}`;
        }

        // Toolbar Helpers
        function insertText(prefix, suffix = '') {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const text = editor.value;
            const before = text.substring(0, start);
            const after = text.substring(end, text.length);
            const selection = text.substring(start, end);

            editor.value = before + prefix + selection + suffix + after;
            editor.focus();
            preview.innerHTML = marked.parse(editor.value);
            updateStats();
        }

        function toggleSettings() {
            document.body.classList.toggle('settings-open');
        }

        function downloadMd() {
            const blob = new Blob([editor.value], { type: 'text/markdown' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'startup-docs.md';
            a.click();
        }

        // AI Functionality
        async function aiAction(type) {
            const key = document.getElementById('api-key').value;
            const model = document.getElementById('model-select').value;
            const status = document.getElementById('ai-status');
            
            if (!key) { alert("Please set your OpenRouter API Key in the AI Assistant panel!"); toggleSettings(); return; }
            if (!editor.value.trim()) return;

            status.innerText = "AI Status: Working...";
            status.className = "animate-pulse text-emerald-400";

            let prompt = "";
            if (type === 'summarize') prompt = "Summarize the following markdown text into a few bullet points while keeping the formatting:";
            if (type === 'professional') prompt = "Rewrite the following markdown text to sound more professional and startup-ready, while maintaining the markdown structure:";

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${key}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": model,
                        "messages": [
                            {"role": "system", "content": "You are a specialized Markdown assistant. Return ONLY the resulting markdown content with no extra preamble or chat."},
                            {"role": "user", "content": `${prompt}\n\n${editor.value}`}
                        ]
                    })
                });

                const data = await response.json();
                editor.value = data.choices[0].message.content;
                preview.innerHTML = marked.parse(editor.value);
                status.innerText = "AI Status: Ready";
                status.className = "text-slate-500";
            } catch (error) {
                alert("AI Error: " + error.message);
                status.innerText = "AI Status: Error";
            }
        }
    </script>
</body>
</html>
